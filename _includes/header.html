<header class="global terminal-header">
  <div class="terminal-bar">
    <span class="terminal-title">infosec@{{ site.title }}:~$</span>
    <div class="terminal-buttons">
      <span class="terminal-button"></span>
      <span class="terminal-button"></span>
      <span class="terminal-button"></span>
    </div>
  </div>
  
  <h3 class="logo">
    <a href="{{ site.baseurl }}/" title="Home" class="cursor">{{ site.title }}</a>
  </h3>
  
  <nav class="terminal-nav">
    <ul>
      <li><a href="/posts" title="Posts" class="cmd-link">cd /posts</a></li>
      <li><a href="/archive" title="Archive" class="cmd-link">cd /archive</a></li>
      <li><a href="/talks" title="Talks" class="cmd-link">cd /talks</a></li>

    </ul>

    overflow: hidden;
  }
  
  .terminal-bar {
    display: flex;

    border-bottom: 1px solid var(--hacker-text-dim);
  }
  
  .terminal-title {
    color: var(--hacker-text-bright);
    font-family: var(--code-font);
    font-size: 0.8rem;
  }
  
  .terminal-buttons {
    display: flex;
  }
  
  .terminal-button {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-left: 5px;
    background-color: var(--hacker-text-dim);
  }
  
  .terminal-nav ul li a {
